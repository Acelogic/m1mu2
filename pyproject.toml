[project]
name = "m1mu2"
version = "0.1.0"
description = "Memory probe workbench for FireRed and read-only Switch 2 sysmodule inspection"
requires-python = ">=3.13"

[project.scripts]
m1mu2 = "m1mu2.entry:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["pokeldn-src", ".venv", "captures"]

[tool.pyright]
extraPaths = ["pokeldn-src"]
exclude = ["pokeldn-src", ".venv"]
